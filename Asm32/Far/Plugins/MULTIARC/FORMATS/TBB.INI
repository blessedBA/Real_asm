[Charset]
; Таблицы кодировок берутся из ветви реестра:
; HKEY_CURRENT_USER\SOFTWARE\Far\CodeTables;
; Формат записи ini файла:
;
; Названия кодировок соответствуют названиям из ветви реестра:
; DOS - без перекодировки
; если кодировка не описана в данной секции или не найдена в теле
; сообщения, то используеся кодировка по умолчанию (Default).
Default="KOI8-R"
koi8-r="KOI8-R"
koi8-u="KOI8-R"
koi8="KOI8-R"
windows-1251="Win-1251"
ibm866="DOS"
ibmpc="DOS"
iso-8859-5="ISO 8859-5"

[Options]
; 1 - группировка по темам включена
Group=1