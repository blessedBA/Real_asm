# Hot keys configuration
#
# Format is: Name = virtualcode,alt,control,shift,win
# Where:
#  virtualcode - code of a key, can be found with "print_codes.exe" by Sergey Oblomov
#
# Pin lister to FAR window (AltEnter)
Lister_Pin = 0x0D,1,0,0,0
# Hide lister (Esc)
Lister_Hide = 0x1B,0,0,0,0
# Switch to next lister tab (CtrlTab)
Lister_NextTab = 0x09,0,1,0,0
# Delete current lister tab (CtrlDel)
Lister_DeleteTab = 0x2E,0,1,0,0
# Delete current lister tab and hide lister (CtrlPgDn)
Lister_DeleteTabHide = 0x22,0,1,0,0
# Delete all lister tabs (CtrlShiftDel)
Lister_DeleteAllTabs = 0x2E,0,1,1,0
# Delete all lister tabs and hide lister (CtrlShiftPgDn)
Lister_DeleteAllTabsHide = 0x22,0,1,1,0
# Hide quick view panel (Nothing)
QView_Hide = 0x0,0,0,0,0
# Open new quick view panel (right from left, left from right) (CtrlQ)
QView_NewPanel = 0x0,0,1,0,0
# Toggle focus in quick view panel (CtrlTab)
QView_ToggleFocus = 0x09,0,1,0,0
