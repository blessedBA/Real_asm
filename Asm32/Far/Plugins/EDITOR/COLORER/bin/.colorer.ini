############################################################
# unix colorer config
base=/usr/share/colorer/hrc/colorer.hrc

# these are defaults
rules.view=/usr/share/colorer/hrd/console/alt.hrd
rules.gen=/usr/share/colorer/hrd/textgen/html.hrd

# and these you can use as  -i black  f.e.
# alternate colors
rules.alt=/usr/share/colorer/hrd/console/alt.hrd
rules.black=/usr/share/colorer/hrd/console/black.hrd
rules.default=/usr/share/colorer/hrd/console/default.hrd
rules.dnlike=/usr/share/colorer/hrd/console/dnlike.hrd
rules.gray=/usr/share/colorer/hrd/console/gray.hrd
rules.nc=/usr/share/colorer/hrd/console/nc.hrd
rules.hack=/usr/share/colorer/hrd/console/hack.hrd
rules.white=/usr/share/colorer/hrd/console/white.hrd
rules.xmastree=/usr/share/colorer/hrd/console/xmastree.hrd

# alternate text format
rules.ansi=/usr/share/colorer/hrd/textgen/ansi.hrd
rules.html=/usr/share/colorer/hrd/textgen/html.hrd
rules.htmli=/usr/share/colorer/hrd/textgen/htmli.hrd
rules.htmlb=/usr/share/colorer/hrd/textgen/htmlb.hrd
rules.htmltag=/usr/share/colorer/hrd/textgen/htmltag.hrd
